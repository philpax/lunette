[workspace]
members = [
    "crates/lunette",
    "crates/lunette-capture",
    "crates/lunette-compositor",
    "crates/lunette-lovr",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

# Every crate here is workspace-internal, so each version is pinned exactly:
# a caret range lets resolution drift between `cargo update` runs, while an
# exact pin makes a bump a reviewable change. `ash` carries build metadata in
# its version, and an exact pin must include it.
[workspace.dependencies]
arc-swap = "=1.9.2"
ash = "=0.38.0+1.3.281"
bindgen = "=0.72.1"
cmake = "=0.1.58"
mlua = "=0.12.0"
mlua-sys = "=0.11.0"
parking_lot = "=0.12.5"
smallvec = "=1.15.2"
smithay = "=0.7.0"
smol_str = "=0.3.6"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
