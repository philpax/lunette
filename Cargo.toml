[workspace]
members = [
    "crates/lunette",
    "crates/lunette-capture",
    "crates/lunette-compositor",
    "crates/lunette-lovr",
    "crates/lunette-luau",
    "crates/lunette-generate-definitions",
]
resolver = "3"

default-members = ["crates/lunette"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

# The restriction lints the CONTRIBUTING checks rely on. Each crate opts in
# with `[lints] workspace = true`; lunette-compositor deliberately does not, so
# the vendored WayVR code stays exempt until it is rewritten.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Every crate here is workspace-internal, so each version is pinned exactly:
# a caret range lets resolution drift between `cargo update` runs, while an
# exact pin makes a bump a reviewable change.
[workspace.dependencies]
arc-swap = "=1.9.2"
ariadne = "=0.6.0"
ash = "=0.38.0"
bindgen = "=0.72.1"
cc = "=1.4.0"
cmake = "=0.1.58"
getrandom = "=0.3.4"
libc = "=0.2.189"
clap = { version = "=4.6.6", features = ["derive"] }
lunette-luau = { path = "crates/lunette-luau" }
mlua = "=0.12.0"
mlua-sys = "=0.11.0"
parking_lot = "=0.12.5"
pretty_assertions = "=1.4.1"
serde = "=1.0.229"
smallvec = "=1.15.2"
# `default-features = false` is set here rather than at the member, because the
# default set drags in libseat, libinput, udev, gbm, winit, and a GL renderer —
# a whole session backend for a compositor that renders nothing itself.
smithay = { version = "=0.7.0", default-features = false }
smol_str = "=0.3.6"
# Constant-time comparison, for the token that attributes a client to a process.
# Handrolling one invites the optimiser to reintroduce the early exit.
subtle = "=2.6.1"
tempfile = "=3.27.0"
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
wayland-client = "=0.31.15"
wayland-protocols = "=0.32.13"
wayland-protocols-misc = { version = "=0.3.12", default-features = false }
wayland-protocols-wlr = { version = "=0.3.12", default-features = false }
# Pin wlx-capture to the WayVR monorepo: the required 0.6.0 code exists there,
# not as an independent release. Fixes belong upstream in that subdirectory.
# Pipewire already brings Wayland; omit xshm because it adds no needed weight.
# Keep xkbcommon at 0.8: smithay 0.7 requires that line and newer versions
# would split the xkb types exchanged with smithay.
xkbcommon = { version = "=0.8.0", features = ["wayland"] }
wlx-capture = { git = "https://github.com/wayvr-org/wayvr", rev = "98f800c644719d3f23a20e50bd3237c29a8082cb", default-features = false, features = [
    "pipewire",
] }

# mlua is vendored as a submodule at vendor/mlua (`philpax/mlua` `lunette`, a
# fork of mlua-rs/mlua at v0.12.0) and mlua-sys is patched in from it: lunette
# uses the LÖVR Luau fork (`philpax/luau` `lunette/luau-bump`), whose
# LUA_TQUATERNION value type shifts Luau's type-tag numbering, and mlua-sys
# compiles its luau ffi constants against upstream Luau. The submodule carries
# the fork-aligned constants (one file, `mlua-sys/src/luau/lua.rs`) plus the ABI
# matches for the fork (cstack 1M, two-arg userdata dtor) that the LÖVR build
# provides, and pins mlua's reference thread under a string key so LÖVR's own
# registry use cannot collide with it.
[patch.crates-io]
mlua = { path = "vendor/mlua" }
mlua-sys = { path = "vendor/mlua/mlua-sys" }
