[workspace]
members = [
    "crates/lunette",
    "crates/lunette-capture",
    "crates/lunette-compositor",
    "crates/lunette-lovr",
    "crates/lunette-luau",
    "crates/lunette-generate-definitions",
]
resolver = "3"

# `cargo run` and `cargo build` with no package named build lunette, the
# crate the development loop works in. The checks name `--workspace`
# explicitly, so the narrow default leaves CI coverage unchanged. A bare
# `cargo test` covers this crate alone, which is the cost of the narrowing.
default-members = ["crates/lunette"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

# The restriction lints the CONTRIBUTING checks rely on. Each crate opts in
# with `[lints] workspace = true`; lunette-compositor does not, so the
# vendored WayVR code stays exempt until it is rewritten.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Every crate here is workspace-internal, so each version is pinned exactly:
# a caret range lets resolution drift between `cargo update` runs, while an
# exact pin makes a bump a reviewable change.
[workspace.dependencies]
arc-swap = "=1.9.2"
ariadne = "=0.6.0"
# 0.38.0+1.3.281 upstream. The build metadata is left off the requirement
# because Cargo ignores it when matching and warns about every mention of
# it; `=0.38.0` pins the release.
ash = "=0.38.0"
bindgen = "=0.72.1"
cc = "=1.4.0"
cmake = "=0.1.58"
getrandom = "=0.3.4"
libc = "=0.2.189"
# The Lua test runner reports each test file as a test of its own, with the
# filtering and output of the built-in harness.
libtest-mimic = "=0.8.2"
clap = { version = "=4.6.6", features = ["derive"] }
lunette-luau = { path = "crates/lunette-luau" }
# LÖVR builds Luau with four-component vectors, including the C push ABI.
mlua = { version = "=0.12.2", features = ["luau-vector4"] }
mlua-sys = "=0.13.0"
parking_lot = "=0.12.5"
# The version `wlx-capture` resolves, so both use one copy. lunette-capture
# watches the PipeWire registry for the removal of a portal's nodes, which
# `wlx-capture` neither reports nor exposes.
pipewire = "=0.10.0"
pretty_assertions = "=1.4.1"
# The plugin graph's model checker generates operation sequences and shrinks
# a failing one to a minimal reproduction.
proptest = "=1.11.0"
serde = "=1.0.229"
# The vendored compositor keeps WayVR's window storage, which is a slotmap. The
# version matches the one smithay already pulls in.
slotmap = "=1.1.1"
smallvec = "=1.15.2"
# `default-features = false` is set here, not at the member. The default
# feature set includes libseat, libinput, udev, gbm, winit, and a GL
# renderer, a whole session backend for a compositor that renders nothing
# itself.
smithay = { version = "=0.7.0", default-features = false }
smol_str = "=0.3.6"
# The crate provides constant-time comparison for the token that attributes a
# client to a process. Handrolling one lets the optimiser reintroduce the
# early exit.
subtle = "=2.6.1"
tempfile = "=3.27.0"
# The build metadata is left off the requirement for the same reason as on
# `ash`: Cargo ignores it when matching and warns about every mention of it.
# The release is `1.1.4+spec-1.1.0`.
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
# Extended grapheme clusters follow Unicode rules rather than a local approximation.
unicode-segmentation = "=1.13.3"
wayland-client = "=0.31.15"
wayland-protocols = "=0.32.13"
# The host-input provider uses `zwp_virtual_keyboard_v1`.
wayland-protocols-misc = { version = "=0.3.12", default-features = false }
# The host-input provider uses `zwlr_virtual_pointer_v1`.
wayland-protocols-wlr = { version = "=0.3.12", default-features = false }
# wlx-capture 0.6.0, pinned at a revision of the WayVR monorepo, not at the
# standalone https://github.com/galister/wlx-capture. That repository is
# stuck at 0.6.0's predecessor, 0.5.4, which depends on `ashpd` with the
# `async-std` executor and on a personal fork of pipewire-rs; 0.6.0 replaced
# both with `dbus` over a hand-rolled portal client and crates.io `pipewire`
# 0.10, and lives only in the monorepo with no independent tag. Fixes still go
# upstream. Upstream is now this subdirectory.
#
# `pipewire` implies `wayland`, so smithay-client-toolkit arrives whatever the
# feature set; dropping `xshm` prunes exactly one crate. Feature pruning is not
# where the weight is. The set names what the crate uses and nothing more.
# The keymap: compilation, forward keysym lookup, and the reverse lookup
# `typeText` is built on. Pinned at 0.8.0 because smithay 0.7 carries a
# non-optional `^0.8.0` dependency on it; 0.9.0 would resolve to a second copy
# and split the xkb types, so a keymap compiled here could not be handed to a
# smithay keyboard. `wayland` is the feature smithay itself uses.
xkbcommon = { version = "=0.8.0", features = ["wayland"] }
wlx-capture = { git = "https://github.com/wayvr-org/wayvr", rev = "98f800c644719d3f23a20e50bd3237c29a8082cb", default-features = false, features = [
    "pipewire",
    "wlr",
] }

# mlua is vendored as a submodule at vendor/mlua (`philpax/mlua` `lunette`, a
# fork of mlua-rs/mlua at v0.12.2) and mlua-sys is patched in from it: lunette
# uses the LÖVR Luau fork (`philpax/luau` `lunette/luau-bump`), whose
# LUA_TQUATERNION value type shifts Luau's type-tag numbering, and mlua-sys
# compiles its luau ffi constants against upstream Luau. The submodule carries
# the fork-aligned constants (one file, `mlua-sys/src/luau/lua.rs`) plus the ABI
# matches for the fork (cstack 1M, two-arg userdata dtor, and the
# `lua_CompileOptions` layout of the Luau the fork is synced to) that the LÖVR
# build provides, and pins mlua's reference thread under a string key so LÖVR's own
# registry use cannot collide with it.
[patch.crates-io]
mlua = { path = "vendor/mlua" }
mlua-sys = { path = "vendor/mlua/mlua-sys" }
