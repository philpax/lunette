[package]
name = "lunette-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
arc-swap.workspace = true
# Only for `dev_t` and `makedev`: `DmabufFeedbackBuilder::new` takes a device
# number, and naming the C type is better than assuming it is `u64` here.
getrandom.workspace = true
libc.workspace = true
smallvec.workspace = true
# `desktop` supplies `Window` and `PopupManager`. `backend_vulkan` stays off:
# it exists to create and own a device, which is the one thing lunette must not
# do, and enabling it would put a graphics dependency in the crate whose tests
# have to run without a device. `xwayland` stays off because xwayland-satellite
# replaces it. calloop, rustix, and wayland-server are reached through
# `smithay::reexports` rather than named here, so there is one version of each
# in the tree by construction.
smithay = { workspace = true, features = ["desktop", "wayland_frontend"] }
subtle.workspace = true
tracing.workspace = true
# A real client, so the tests exercise the protocol rather than the handlers
# directly. Pinned to the versions smithay's `wayland-server` shares a
# `wayland-backend` with; a split would make the two halves unable to talk.
# Optional, and pulled in only by `test-fakes`, because `src/test_client.rs`
# needs them and integration tests reach that module through the feature rather
# than through `cfg(test)`.
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, features = ["client"], optional = true }

[features]
# The in-process compositor, the test client, and the fake importer that stands
# in for a graphics device. Off by default so a release build carries none of
# them; integration tests turn it on through the self dev-dependency below, and
# the crate's own unit tests get it through `cfg(test)` plus the dev-dependency
# copies of the same crates.
test-fakes = ["dep:wayland-client", "dep:wayland-protocols"]

[dev-dependencies]
# The crate depending on itself is how an integration test gets a feature the
# library does not enable by default. Without it, `tests/` would see a
# `lunette-compositor` with no `testing` or `test_client` module at all.
lunette-compositor = { path = ".", features = ["test-fakes"] }
pretty_assertions.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client"] }
