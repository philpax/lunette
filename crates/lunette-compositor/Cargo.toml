[package]
name = "lunette-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
arc-swap.workspace = true
# The operating system's CSPRNG, for the token that attributes a client to the
# process lunette started it as. Never a userspace generator: a token that can
# be predicted is an attribution a hostile client can claim.
getrandom.workspace = true
# Only for `dev_t` and `makedev`: `DmabufFeedbackBuilder::new` takes a device
# number, and naming the C type is better than assuming it is `u64` here.
libc.workspace = true
lunette-luau.workspace = true
smallvec.workspace = true
# `desktop` supplies `Window` and `PopupManager`. `backend_vulkan` stays off:
# it exists to create and own a device, which is the one thing lunette must not
# do, and enabling it would put a graphics dependency in the crate whose tests
# have to run without a device. `xwayland` stays off because xwayland-satellite
# replaces it. calloop, rustix, and wayland-server are reached through
# `smithay::reexports` rather than named here, so there is one version of each
# in the tree by construction.
smithay = { workspace = true, features = ["desktop", "wayland_frontend"] }
subtle.workspace = true
tracing.workspace = true
# The keymap module. Named here as well as reached through smithay, because
# `crate::keymap` compiles keymaps in its own context rather than smithay's:
# libxkbcommon is not thread-safe, so each thread that queries a keymap owns
# one. The pin keeps both halves on one copy of the xkb types.
xkbcommon.workspace = true
# Two uses, one crate. `src/selection/data_control.rs` speaks
# `ext_data_control_v1` to the compositor as a client, which is how the
# clipboard crosses the boundary; and `src/test_client.rs` drives lunette's own
# protocol from a real client. Pinned to the versions smithay's `wayland-server`
# shares a `wayland-backend` with; a split would make the two halves unable to
# talk.
wayland-client.workspace = true
# `client` for the two above. `staging` gates `ext::data_control`, and
# `unstable` gates the `zv1` protocols the test client uses.
wayland-protocols = { workspace = true, features = [
    "client",
    "staging",
    "unstable",
] }
# `zwlr_data_control_v1`, the fallback for a host without ext-data-control.
wayland-protocols-wlr = { workspace = true, features = ["client"] }

[features]
# The in-process compositor, the test client, the fake importer that stands in
# for a graphics device, and the fake host clipboard. Off by default so a release
# build carries none of them; integration tests turn it on through the self
# dev-dependency below, and the crate's own unit tests get it through
# `cfg(test)`.
test-fakes = []

[dev-dependencies]
# The crate depending on itself is how an integration test gets a feature the
# library does not enable by default. Without it, `tests/` would see a
# `lunette-compositor` with no `testing` or `test_client` module at all.
lunette-compositor = { path = ".", features = ["test-fakes"] }
pretty_assertions.workspace = true
