[package]
name = "lunette-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
arc-swap.workspace = true
# The token uses the operating system's CSPRNG. An unpredictable token prevents
# a hostile client from claiming another process's attribution.
getrandom.workspace = true
# WayVR's hit test works in `glam` vectors; `src/wayvr/hit_test.rs` keeps them
# so the file diffs cleanly against upstream.
glam.workspace = true
# Provides `dev_t` and `makedev` for DRM device numbers. The C type preserves the
# platform-specific width accepted by `DmabufFeedbackBuilder::new`.
libc.workspace = true
# Provides `closed_set!` without linking a Lua binding.
lunette-luau.workspace = true
# WayVR's `WindowManager` keys windows by slotmap handles; `src/wayvr/window.rs`
# keeps that storage so the file diffs cleanly against upstream.
slotmap.workspace = true
smallvec.workspace = true
# `desktop` provides `Window` and `PopupManager`. Keep `backend_vulkan` disabled:
# lunette does not create a graphics device, and enabling it adds an unnecessary
# graphics dependency to a crate whose tests run without a device. Keep `xwayland`
# disabled because xwayland-satellite provides that integration. Use
# `smithay::reexports` for calloop, rustix, and wayland-server to keep one version
# of each type in the tree.
smithay = { workspace = true, features = ["desktop", "wayland_frontend"] }
subtle.workspace = true
tracing.workspace = true
# `crate::keymap` compiles keymaps outside Smithay's context. libxkbcommon is not
# thread-safe, so each querying thread owns its context. Keep this dependency on
# Smithay's xkb version so both contexts use one copy of the xkb types.
xkbcommon.workspace = true
# The in-process test client uses this crate. Keep its version aligned with
# Smithay's `wayland-server` so both sides share `wayland-backend` types.
wayland-client.workspace = true
# The `client` feature supports the test client, and `unstable` enables the
# `zv1` protocols its tests use.
wayland-protocols = { workspace = true, features = ["client", "unstable"] }

[features]
# Enables the in-process compositor, test client, fake graphics importer, and
# fake host clipboard. Disabled by default; integration tests enable it through
# the self dev-dependency, while unit tests use `cfg(test)`.
test-fakes = []

[dev-dependencies]
# This self-dependency enables `test-fakes` for integration tests. Without it,
# Cargo compiles the library without its test-only modules.
lunette-compositor = { path = ".", features = ["test-fakes"] }
pretty_assertions.workspace = true
