[package]
name = "lunette-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
arc-swap.workspace = true
# Only for `dev_t` and `makedev`: `DmabufFeedbackBuilder::new` takes a device
# number, and naming the C type is better than assuming it is `u64` here.
getrandom.workspace = true
libc.workspace = true
smallvec.workspace = true
# `desktop` supplies `Window` and `PopupManager`. `backend_vulkan` stays off:
# it exists to create and own a device, which is the one thing lunette must not
# do, and enabling it would put a graphics dependency in the crate whose tests
# have to run without a device. `xwayland` stays off because xwayland-satellite
# replaces it. calloop, rustix, and wayland-server are reached through
# `smithay::reexports` rather than named here, so there is one version of each
# in the tree by construction.
smithay = { workspace = true, features = ["desktop", "wayland_frontend"] }
subtle.workspace = true
tracing.workspace = true

[features]
# The in-process compositor and the fake importer that stand in for a graphics
# device. Off by default so a release build carries neither; integration tests
# turn it on, and the crate's own unit tests get it through `cfg(test)`.
test-fakes = []

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
# A real client, so the tests exercise the protocol rather than the handlers
# directly. Pinned to the versions smithay's `wayland-server` shares a
# `wayland-backend` with; a split would make the two halves unable to talk.
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client"] }
