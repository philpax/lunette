[package]
name = "lunette-generate-definitions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Generates the LÖVR Luau definitions from lovr-docs metadata"
build = "build.rs"

[dependencies]
# The generator calls `lua::declarations::render`, which produces the
# `lunette` module surface that the checker loads. The `lunette` crate
# defines the declarations next to the mlua registrations they describe.
# The generator reads them from the crate and does not restate them.
lunette = { path = "../lunette" }
lunette-lovr = { path = "../lunette-lovr" }
mlua = { workspace = true, features = ["luau"] }
mlua-sys = { workspace = true, features = ["external"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true