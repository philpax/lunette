[package]
name = "lunette-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
calloop.workspace = true
# The host clipboard client implements the compositor's `HostSelectionSource`
# seam and speaks its selection vocabulary.
lunette-compositor = { path = "../lunette-compositor" }
lunette-luau.workspace = true
# `src/hid/evdev.rs` defines the input ABI and states why `input-linux` is not used.
libc.workspace = true
parking_lot.workspace = true
pipewire.workspace = true
serde = { workspace = true, features = ["derive"] }
# A frame has at most four planes, so the usual case fits in the inline buffer.
smallvec.workspace = true
# Restore tokens contain arbitrary EDID text, which a hand-rolled format would
# have to escape.
toml.workspace = true
tracing.workspace = true
wayland-client.workspace = true
# `unstable` exposes `zxdg_output_manager_v1` for logical output geometry, and
# `staging` exposes `ext_data_control_v1` for the host clipboard.
wayland-protocols = { workspace = true, features = [
    "client",
    "staging",
    "unstable",
] }
# `zwp_virtual_keyboard_v1` is generated in the misc protocol set, although
# wlroots implements it.
wayland-protocols-misc = { workspace = true, features = ["client"] }
# `zwlr_virtual_pointer_v1` for host input, and `zwlr_data_control_v1` as the
# clipboard fallback when the host lacks `ext_data_control_v1`.
wayland-protocols-wlr = { workspace = true, features = ["client"] }
wlx-capture.workspace = true

[features]
# Exposes `CapturedFrame::from_parts` to other crates' tests.
test-fakes = []

[dev-dependencies]
pretty_assertions.workspace = true
# Checks `VirtualKey` against xkeyboard-config's evdev keycodes.
xkbcommon.workspace = true

[lints]
workspace = true
