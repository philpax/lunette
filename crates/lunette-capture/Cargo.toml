[package]
name = "lunette-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The uinput device: the `input_event` and `uinput_setup` structures, plus
# `ioctl`, `write`, and `memfd_create`. The ioctl request numbers and the
# event-type constants are not in `libc` and are written out in
# `src/hid/evdev.rs`; see that file for why `input-linux` is not taken instead.
libc.workspace = true
# The frame queue's lock. Every span under it is a push or a pop with no await
# and no reentry, which is what the non-poisoning guard is for.
parking_lot.workspace = true
# The monitor identity that keys a restore token, and the file that holds them.
# `derive` is what the identity types are written with; the format is `toml`.
serde = { workspace = true, features = ["derive"] }
# A frame carries at most four planes, so the usual case allocates nothing.
smallvec.workspace = true
# The restore-token file's format. A serialised format rather than a hand-rolled
# encoding because the file holds a monitor's make and model, which is whatever
# its EDID says: quoting and escaping arbitrary text is exactly the kind of tail
# that is not worth handrolling. Already in the tree, so it costs no new crate.
toml.workspace = true
tracing.workspace = true
# The `wl_virtual` input provider and the `wl_output` enumeration talk to the
# host compositor directly, as a client. Already in the tree beneath
# wlx-capture, so neither adds a crate.
wayland-client.workspace = true
# `zxdg_output_manager_v1`, which reports each output's logical geometry — the
# space a screencast stream's position and size are correlated against.
# `unstable` is what gates the `zv1` protocols.
wayland-protocols = { workspace = true, features = ["client", "unstable"] }
# `zwp_virtual_keyboard_v1`. It lives in the misc set rather than the wlr one
# because it started as a GNOME-adjacent proposal, but only wlroots implements
# it, so it travels with `zwlr_virtual_pointer_v1` in practice.
wayland-protocols-misc = { workspace = true, features = ["client"] }
# `zwlr_virtual_pointer_v1`.
wayland-protocols-wlr = { workspace = true, features = ["client"] }
wlx-capture.workspace = true

[features]
# The scripted portal that stands in for xdg-desktop-portal, and the recording
# input provider that stands in for uinput and the host compositor. Off by
# default so a release build carries none of it; the crate's own unit tests
# reach them through `cfg(test)`.
test-fakes = []

[dev-dependencies]
pretty_assertions.workspace = true

[lints]
workspace = true
