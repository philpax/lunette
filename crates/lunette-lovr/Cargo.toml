[package]
name = "lunette-lovr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# Declaring the native library lets the build script publish the directories it
# found through `cargo::metadata`, which Cargo forwards to dependents as
# `DEP_LOVR_*`. That is the only channel available: `cargo::rustc-link-arg`
# applies to the emitting package's own targets, so the rpath entries this crate
# emits never reach the `lunette` binary on their own.
links = "lovr"

[build-dependencies]
# LOVR exports no CMake interface, so the build script drives cmake directly and
# generates the FFI surface with bindgen rather than consuming a package config.
bindgen = { workspace = true }
cmake = { workspace = true }

[lints]
workspace = true
