[package]
name = "lunette-lovr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# With the `links` declaration, the build script publishes the directories
# it finds through `cargo::metadata`. Cargo forwards them to dependents as
# `DEP_LOVR_*`. `cargo::rustc-link-arg` applies to the emitting package's
# own targets, so the rpath entries this crate emits do not reach the
# `lunette` binary through that directive.
links = "lovr"

[build-dependencies]
# LOVR exports no CMake interface, so the build script runs cmake directly
# and generates the FFI surface with bindgen. No package config exists to
# consume.
bindgen = { workspace = true }
# The `cc` crate compiles the C surface over Luau's C++ frontend that
# `lunette check` uses.
cc = { workspace = true }
cmake = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
