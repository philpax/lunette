[package]
name = "lunette"
# Two binaries ship from this crate, and `cargo run` needs to know which one a
# bare invocation means. lunctl is reached with `--bin lunctl`.
default-run = "lunette"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The Vulkan surface lunette drives against the device LOVR created. The
# default features stay on for `loaded`, which is what provides `Entry::load`:
# LOVR resolves `vkGetInstanceProcAddr` out of a `dlopen`ed loader and exports
# neither the pointer nor a link-time symbol, so ash opens the same library
# itself. `linked` is deliberately not used — it would put a build-time
# dependency on a Vulkan SDK in the way of a build that needs no device.
ash.workspace = true
# `geteuid`, for the check that the control socket's directory is this user's.
libc.workspace = true
lunette-capture = { path = "../lunette-capture" }
lunette-compositor = { path = "../lunette-compositor" }
lunette-lovr = { path = "../lunette-lovr" }
parking_lot.workspace = true
# Only for the `Dmabuf`, `Fourcc`, and `Modifier` types the compositor's import
# seam is written in. The features stay at the base set: nothing here touches
# the frontend or the desktop helpers, and Cargo unifies this with the richer
# set `lunette-compositor` asks for.
smithay.workspace = true
ariadne = { workspace = true }
clap = { workspace = true }
# The Luau type language and the `closed_set!` macro. The mlua feature adds the
# impls for mlua's own types, which only this crate needs.
lunette-luau = { workspace = true, features = ["mlua"] }
mlua = { workspace = true, features = ["luau"] }
# `mlua-sys` is a direct dependency purely to reach its `external` feature,
# which mlua's own feature table does not re-export. With `external` set,
# mlua-sys emits no link directives and never calls `probe_lua()`, leaving
# lunette-lovr's build script as the sole source of link flags. Without it,
# mlua either vendors its own Luau/LuaJIT or probes for a system one, and
# collides with the Luau that LOVR already builds. LOVR links Luau into
# `liblovr.so` under `LOVR_USE_LUAU` with `LUAU_EXTERN_C`, so mlua resolves
# the C API from `liblovr.so` directly.
mlua-sys = { workspace = true, features = ["external"] }
tracing.workspace = true
# `env-filter` is not in the default feature set, and without it the binary's
# log level cannot be changed through `RUST_LOG`.
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# The crate depending on a sibling with a feature the library does not enable is
# how the capture import path gets a frame to import: `CapturedFrame::from_parts`
# exists only under `test-fakes`, because nothing in production builds one.
lunette-capture = { path = "../lunette-capture", features = ["test-fakes"] }
# `TestCompositor`, for the integration test that runs the host-output
# enumeration against a real Wayland compositor with no graphics device.
lunette-compositor = { path = "../lunette-compositor", features = ["test-fakes"] }
pretty_assertions.workspace = true
tempfile.workspace = true

[lints]
workspace = true
