[package]
name = "lunette"
# The crate builds two binaries. A bare `cargo run` selects this one, and
# lunctl is reached with `--bin lunctl`.
default-run = "lunette"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Offscreen Vulkan tests require an explicitly selected software driver.
graphics-tests = []

[dependencies]
# The Vulkan surface lunette uses on the device LOVR created.
# The default features stay on, and `loaded` provides `Entry::load`:
# LOVR resolves `vkGetInstanceProcAddr` from a `dlopen`ed loader and
# exports neither the pointer nor a link-time symbol, so ash opens the same library itself.
# `linked` is off. It would require a Vulkan SDK at build time, and the build needs no device.
ash.workspace = true
# `geteuid`, for the check that the control socket's directory is this user's.
libc.workspace = true
lunette-capture = { path = "../lunette-capture" }
lunette-compositor = { path = "../lunette-compositor" }
lunette-lovr = { path = "../lunette-lovr" }
parking_lot.workspace = true
# Provides the `Dmabuf`, `Fourcc`, and `Modifier` types the compositor's import seam uses.
# The features stay at the base set: nothing here touches the frontend or the desktop helpers.
# Cargo unifies this with the richer set that `lunette-compositor` enables.
smithay.workspace = true
ariadne = { workspace = true }
clap = { workspace = true }
# The Luau type language and the `closed_set!` macro.
# The `mlua` feature adds the impls for mlua's own types. This crate is their sole consumer.
lunette-luau = { workspace = true, features = ["mlua"] }
lunette-ui = { path = "../lunette-ui" }
# The binding builds taffy styles from Lua tables.
taffy = { workspace = true }
mlua = { workspace = true, features = ["luau"] }
# `mlua-sys` is a direct dependency for its `external` feature.
# mlua's own feature table does not re-export that feature.
# With `external` set, mlua-sys emits no link directives and never calls `probe_lua()`,
# leaving lunette-lovr's build script as the sole source of link flags.
# Without it, mlua vendors its own Luau or LuaJIT, or probes for a system one, and
# collides with the Luau that LOVR builds.
# LOVR links Luau into `liblovr.so` under `LOVR_USE_LUAU` with `LUAU_EXTERN_C`,
# so mlua resolves the C API from `liblovr.so` directly.
mlua-sys = { workspace = true, features = ["external"] }
tracing.workspace = true
# `env-filter` is not in the default feature set.
# Without it, the binary's log level cannot be changed through `RUST_LOG`.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-segmentation.workspace = true

[dev-dependencies]
# `CapturedFrame::from_parts` exists under the `test-fakes` feature,
# because nothing in production builds one.
# The dev-dependency enables the feature so the capture import path gets a frame to import.
lunette-capture = { path = "../lunette-capture", features = ["test-fakes"] }
# `TestCompositor`, for the integration test that runs the host-output enumeration
# against a real Wayland compositor with no graphics device.
lunette-compositor = { path = "../lunette-compositor", features = ["test-fakes"] }
# The standard kinds' bundled faces, so layout and glyph tests measure the same everywhere.
lunette-ui = { path = "../lunette-ui", features = ["test-fonts"] }
libtest-mimic.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# The Lua test runner discovers its tests at run time, one per test file under
# `lua/`, which the built-in harness cannot express.
[[test]]
name = "lua"
path = "tests/lua/main.rs"
harness = false

# LÖVR's graphics state is process-global; one custom trial runs all fixtures serially.
[[test]]
name = "graphics"
path = "tests/graphics/main.rs"
harness = false
required-features = ["graphics-tests"]

[[bench]]
name = "desktop"
path = "benches/desktop.rs"
harness = false

[lints]
workspace = true
