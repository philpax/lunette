[package]
name = "lovr-docs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Regenerates the LÖVR Luau definitions from lovr-docs metadata"
build = "build.rs"

[dependencies]
lunette-lovr = { path = "../lunette-lovr" }
mlua = { workspace = true, features = ["luau"] }
mlua-sys = { workspace = true, features = ["external"] }