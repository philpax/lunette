name: check

# Check pushes to main and all pull requests. Pull-request runs validate the
# merge result without duplicating the push run for branches with open PRs.
on:
  push:
    branches: [main]
  pull_request:

# Successive pushes to a branch cancel each other. The group is keyed on the
# branch under either event.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Read-only repository permissions; the StyLua action needs the token to fetch
# its release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep line-level panic locations while reducing cache size and linker work.
  # Both profiles match the commands used by CI.

  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustfmt.toml opts into imports_granularity and group_imports, which
      # stable rustfmt skips silently.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version

      - run: make check-format

  # Clippy and tests use separate artifact caches, so CI runs them in parallel.
  # Generated checks run with the test half because it has the required binaries.
  build:
    strategy:
      fail-fast: false
      matrix:
        half: [clippy, test]
    name: build (${{ matrix.half }})
    runs-on: ubuntu-latest
    env:
      # The build script points FETCHCONTENT_SOURCE_DIR_JOLTPHYSICS here, which
      # keeps cmake off the network.
      LUNETTE_JOLTPHYSICS_SRC: ${{ github.workspace }}/.jolt
      # crates/lunette/tests/mullion_spec.rs boots a session, which opens a
      # socket under the runtime directory and resolves its state directory from
      # XDG_STATE_HOME or else from HOME. A runner sets neither, and the tests
      # remove HOME.
      XDG_RUNTIME_DIR: ${{ github.workspace }}/.runtime
      XDG_STATE_HOME: ${{ github.workspace }}/.state
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required to restore committed file mtimes.
          fetch-depth: 0

      # Not `submodules: recursive` on the checkout: fetch-depth is not
      # per-repository, and only the pinned commit of each is built. The clones
      # wait on the network rather than on the runner's cores.
      - name: Check out the submodules
        run: git submodule update --init --recursive --depth 1 --jobs 8

      - name: Install the system dependencies
        # Install the devshell dependencies under their Debian names. The X11, xcb,
        # and xkbcommon packages are split on Debian, and libclang is required
        # for bindgen.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake pkg-config python3 \
            libclang-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxcb1-dev libxext-dev libxkbcommon-dev \
            libx11-xcb-dev libxcb-xinput-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libvulkan-dev libgl1-mesa-dev libcurl4-openssl-dev \
            libasound2-dev libdbus-1-dev libssl-dev libpipewire-0.3-dev \
            libwayland-dev wayland-protocols \
            libopenxr-dev

      # Restore committed mtimes so Cargo can reuse cached artifacts instead of
      # rebuilding every crate and rerunning LÖVR's CMake build. The Debian helper
      # is unsuitable because newer Git rejects its `git whatchanged` invocation
      # without an explicit compatibility flag.
      - name: Date the tree from its commits
        run: |
          git -c core.quotePath=false log --no-merges --pretty=format:@%ct --name-only |
            awk '/^@/ { stamp = substr($0, 2); next }
                 NF && !seen[$0]++ { print stamp "\t" $0 }' |
            while IFS=$'\t' read -r stamp path; do
              if [ -e "$path" ]; then touch -h -d "@$stamp" -- "$path"; fi
            done
          git submodule foreach --recursive --quiet '
            stamp=$(git show -s --format=%ct HEAD)
            find . -type f -not -path "./.git/*" -exec touch -h -d "@$stamp" {} +
          '

      - name: Make the runtime directories
        run: mkdir -p .runtime .state && chmod 700 .runtime

      # Fetch the Jolt revision required by joltc. Providing it locally keeps CMake's
      # FetchContent step offline and follows the submodule's declared tag.
      - name: Fetch JoltPhysics
        uses: actions/checkout@v4
        with:
          repository: jrouwe/JoltPhysics
          ref: v5.5.0
          path: .jolt

      - uses: Swatinem/rust-cache@v2
        with:
          # A cache is written once: an exact key match saves nothing, so
          # replacing a lineage means bumping this.
          prefix-key: v1
          # The halves keep separate caches, because their artifacts are separate.
          key: ${{ matrix.half }}
          cache-all-crates: true
          # LÖVR is built into crates/lunette-lovr's OUT_DIR. The prune keeps
          # only the packages it is handed, which by default excludes the
          # workspace's own crates on the reasoning that they are cheap to
          # rebuild. That does not hold for a crate wrapping a cmake tree.
          cache-workspace-crates: true
          # Without this the action saves nothing unless the job passes, and
          # iterating on a red CI recompiles everything each time.
          cache-on-failure: true

      - run: make check-${{ matrix.half }}

      # The definitions and the module declarations are generated and checked
      # in. Nothing else notices when the metadata or the registration surface
      # moves and the artifact does not.
      - run: make check-definitions
        if: matrix.half == 'test'

      - run: make check-luau
        if: matrix.half == 'test'
