name: check

# Each job runs a `make` target, so `make check` runs what CI runs.

# Only main on push, because a pull request's run checks the merge result.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables are enough to locate a panic. Both profiles are set so their
  # artifacts can be shared.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustfmt.toml uses options that stable rustfmt skips silently.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version

      - run: make check-format

  # The halves are separate jobs because clippy builds through
  # RUSTC_WORKSPACE_WRAPPER and shares no artifacts with a normal build.
  build:
    strategy:
      fail-fast: false
      matrix:
        half: [clippy, test]
    name: build (${{ matrix.half }})
    runs-on: ubuntu-latest
    env:
      # Keeps cmake off the network.
      LUNETTE_JOLTPHYSICS_SRC: ${{ github.workspace }}/.jolt
      # The exit-status tests boot a session, which needs both directories.
      # A runner sets neither, and the tests remove HOME.
      XDG_RUNTIME_DIR: ${{ github.workspace }}/.runtime
      XDG_STATE_HOME: ${{ github.workspace }}/.state
    steps:
      - uses: actions/checkout@v4
        with:
          # The dating step reads the history.
          fetch-depth: 0

      # Separate from the checkout, because fetch-depth is not per-repository.
      - name: Check out the submodules
        run: git submodule update --init --recursive --depth 1 --jobs 8

      # The runner image's toolchain lags, and a newer clippy lint then fails
      # as unknown under `-D warnings`.
      - name: Install the current stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install the system dependencies
        # The devshell's inputs, as their Debian names. Debian splits out the
        # xcb packages LÖVR's Linux backend links, which nixpkgs bundles.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake pkg-config python3 patchelf glslang-tools \
            libclang-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxcb1-dev libxext-dev libxkbcommon-dev \
            libx11-xcb-dev libxcb-xinput-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dev libcurl4-openssl-dev \
            libasound2-dev libdbus-1-dev libssl-dev libpipewire-0.3-dev \
            libwayland-dev wayland-protocols \
            libopenxr-dev

      # Cargo compares mtimes, and a checkout's are newer than the cached
      # artifacts. git-restore-mtime stamps nothing on git 2.50 and later.
      # A file takes the time its change reached the first-parent history, so
      # a merged branch's older commits cannot date it before a cached build.
      - name: Date the tree from its commits
        run: |
          git -c core.quotePath=false log --first-parent --diff-merges=first-parent --pretty=format:@%ct --name-only |
            awk '/^@/ { stamp = substr($0, 2); next }
                 NF && !seen[$0]++ { print stamp "\t" $0 }' |
            while IFS=$'\t' read -r stamp path; do
              if [ -e "$path" ]; then touch -h -d "@$stamp" -- "$path"; fi
            done
          git submodule foreach --recursive --quiet '
            stamp=$(git show -s --format=%ct HEAD)
            find . -type f -not -path "./.git/*" -exec touch -h -d "@$stamp" {} +
          '

      - name: Make the runtime directories
        run: mkdir -p .runtime .state && chmod 700 .runtime

      # The tag must match the GIT_TAG in deps/joltc/CMakeLists.txt.
      - name: Fetch JoltPhysics
        uses: actions/checkout@v4
        with:
          repository: jrouwe/JoltPhysics
          ref: v5.5.0
          path: .jolt

      - uses: Swatinem/rust-cache@v2
        with:
          # An exact key match saves nothing, so replacing a cache means
          # bumping this.
          prefix-key: v1
          key: ${{ matrix.half }}
          cache-all-crates: true
          # LÖVR is built into crates/lunette-lovr's OUT_DIR, which is not
          # cheap to rebuild.
          cache-workspace-crates: true
          # Iterating on a red CI otherwise recompiles everything.
          cache-on-failure: true

      - run: make check-headset
        if: matrix.half == 'test'

      - run: make check-install
        if: matrix.half == 'test'

      - name: Check offscreen graphics with Mesa lavapipe
        if: matrix.half == 'test'
        run: |
          icd=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          # Mesa versions that omit the architecture use this name.
          if [ ! -f "$icd" ]; then icd=/usr/share/vulkan/icd.d/lvp_icd.json; fi
          test -f "$icd"
          env -u DISPLAY -u WAYLAND_DISPLAY VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd" make check-graphics check-benchmarks

      - run: make check-${{ matrix.half }}

      - run: make check-codegen
        if: matrix.half == 'test'

      - run: make check-definitions
        if: matrix.half == 'test'

      - run: make check-luau-annotations
        if: matrix.half == 'test'

      - run: make check-luau
        if: matrix.half == 'test'

  windows:
    name: Windows x64 build and tests
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      WINDOWS_TARGET: x86_64-pc-windows-gnullvm
      CMAKE_GENERATOR: Ninja
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure LLVM-MinGW and bindgen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '20261020'
          $name = "llvm-mingw-$version-ucrt-x86_64"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$name.zip" -OutFile $archive
          $sha256 = 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $sha256) {
              throw 'LLVM-MinGW archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $llvm = Join-Path $env:RUNNER_TEMP $name
          $bin = Join-Path $llvm 'bin'
          $cc = Join-Path $bin 'x86_64-w64-mingw32-clang.exe'
          $cxx = Join-Path $bin 'x86_64-w64-mingw32-clang++.exe'
          $ar = Join-Path $bin 'llvm-ar.exe'
          $resource = & $cc -print-resource-dir
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate the clang resource directory.' }
          $ucrt = (Join-Path $llvm 'include').Replace('\', '/')
          $clang = "$($resource.Replace('\', '/'))/include"
          $bindgen = Join-Path $env:RUNNER_TEMP 'lunette-libclang'
          python -m pip install --target $bindgen libclang==18.1.1
          if ($LASTEXITCODE -ne 0) { throw 'Could not install libclang for bindgen.' }

          $bin >> $env:GITHUB_PATH
          "LLVM_MINGW_DIR=$llvm" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/lunette-target" >> $env:GITHUB_ENV
          "CC=$cc" >> $env:GITHUB_ENV
          "CXX=$cxx" >> $env:GITHUB_ENV
          "AR=$ar" >> $env:GITHUB_ENV
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=$cc" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$bindgen/clang/native" >> $env:GITHUB_ENV
          "BINDGEN_EXTRA_CLANG_ARGS=-isystem `"$ucrt`" -isystem `"$clang`"" >> $env:GITHUB_ENV

      - name: Install Rust for LLVM-MinGW
        shell: pwsh
        run: |
          $toolchain = "stable-$env:WINDOWS_TARGET"
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV

      - name: Build the Windows host and tools
        shell: pwsh
        run: |
          $build = cargo build --locked --target $env:WINDOWS_TARGET -p lunette -p lunette-generate-definitions --bins --message-format=json-render-diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lovr = @($build | ForEach-Object { ConvertFrom-Json -InputObject $_ } | Where-Object {
              $_.reason -eq 'build-script-executed' -and $_.package_id -match '/lunette-lovr#'
          })
          if ($lovr.Count -ne 1) { throw 'Could not identify the LÖVR build output from Cargo.' }
          $dll = Get-ChildItem -LiteralPath $lovr[0].out_dir -Recurse -File -Filter 'liblovr.dll'
          if (@($dll).Count -ne 1) { throw 'Expected one built liblovr.dll.' }
          $dll.DirectoryName >> $env:GITHUB_PATH
          "LUNETTE_LOVR_DIR=$($dll.DirectoryName)" >> $env:GITHUB_ENV

      - name: Test the Windows host and capture library
        shell: pwsh
        run: |
          cargo test --locked --target $env:WINDOWS_TARGET -p lunette-capture --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target $env:WINDOWS_TARGET -p lunette --lib --test lua
          exit $LASTEXITCODE

      - name: Package and smoke-test the Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'Lunette-windows-x64.zip'
          ./etc/windows/package.ps1 `
              -BinaryDirectory "$env:CARGO_TARGET_DIR/$env:WINDOWS_TARGET/debug" `
              -LovrDirectory $env:LUNETTE_LOVR_DIR `
              -LlvmMingwDirectory $env:LLVM_MINGW_DIR `
              -OutputZip $zip
          $bundle = Join-Path $env:RUNNER_TEMP 'lunette-windows-smoke'
          Expand-Archive -LiteralPath $zip -DestinationPath $bundle
          & "$bundle/lunette.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$bundle/lunette.exe" check "$bundle/config"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        with:
          name: Lunette-windows-x64
          path: ${{ runner.temp }}/Lunette-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
