name: check

# The standing checks CONTRIBUTING.md lists. Each job runs a `make` target
# rather than restating the commands, so the list has one definition and a
# contributor running `make check` runs what CI runs.
on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A failed build in CI is read once and thrown away, so the debug information
  # is a download cost with no reader.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Both formatters. Neither compiles anything, so this needs no submodules and
  # none of the system libraries the LÖVR build wants.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CONTRIBUTING.md requires nightly rustfmt: rustfmt.toml opts into
      # imports_granularity and group_imports, which stable skips silently.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      # Installs the binary and puts it on PATH; `--version` is the cheapest
      # thing to run, since `make check-format` is what checks the tree.
      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version

      - run: make check-format

  # Everything that compiles the workspace. LÖVR is built from source by
  # crates/lunette-lovr's build script, which is most of the wall clock here.
  build:
    runs-on: ubuntu-latest
    env:
      # Where the JoltPhysics checkout below lands. The build script points
      # FETCHCONTENT_SOURCE_DIR_JOLTPHYSICS at it, which is what keeps cmake off
      # the network.
      LUNETTE_JOLTPHYSICS_SRC: ${{ github.workspace }}/.jolt
      # crates/lunette/tests/mullion_spec.rs boots a session, which opens a
      # listening socket under the runtime directory, and LÖVR's save directory
      # derives from the state one. A runner sets neither.
      XDG_RUNTIME_DIR: ${{ github.workspace }}/.runtime
      XDG_STATE_HOME: ${{ github.workspace }}/.state
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the system dependencies
        # The devshell's buildInputs and nativeBuildInputs, as their Debian
        # names. libclang is what bindgen parses LÖVR's headers with, and the
        # rest are what LÖVR, the compositor, and the capture stack link
        # against.
        #
        # The devshell's list does not map one to one. nixpkgs ships every xcb
        # extension in libxcb, and the Xlib and xkbcommon bridges to xcb in
        # libx11 and libxkbcommon; Debian splits all four out. LÖVR's Linux
        # backend links X11-xcb, xcb-xinput, xcb-xkb, and xkbcommon-x11
        # (vendor/lovr/CMakeLists.txt:949), so the split packages are named
        # here even though nothing in the devshell names them.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build pkg-config python3 \
            libclang-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxcb1-dev libxext-dev libxkbcommon-dev \
            libx11-xcb-dev libxcb-xinput-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libvulkan-dev libgl1-mesa-dev libcurl4-openssl-dev \
            libasound2-dev libdbus-1-dev libssl-dev libpipewire-0.3-dev \
            libwayland-dev wayland-protocols \
            libopenxr-dev

      - name: Make the runtime directories
        run: mkdir -p .runtime .state && chmod 700 .runtime

      # deps/joltc reaches JoltPhysics through FetchContent, which wants the
      # network at configure time. The devshell prefetches it and points
      # FETCHCONTENT_SOURCE_DIR_JOLTPHYSICS at the result; this does the same
      # with a checkout. The tag is what deps/joltc/CMakeLists.txt declares as
      # its GIT_TAG, and moves when that submodule is bumped.
      - name: Fetch JoltPhysics
        uses: actions/checkout@v4
        with:
          repository: jrouwe/JoltPhysics
          ref: v5.5.0
          path: .jolt

      - uses: Swatinem/rust-cache@v2
        with:
          # The LÖVR build lives under target/, so the cache is what keeps the
          # ten-minute cmake configure off the common path.
          cache-all-crates: true

      - run: make check-rust

      # The definitions are generated and checked in. Nothing else notices when
      # the metadata moves and the artifact does not.
      - run: make check-definitions

      # The same in-process checker `lunette check` runs, over the standard
      # library and the shipped configuration.
      - run: make check-luau
