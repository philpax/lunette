name: check

# Each job runs a `make` target, so `make check` runs what CI runs.

# Only main on push, because a pull request's run checks the merge result.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables are enough to locate a panic. Both profiles are set so their
  # artifacts can be shared.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustfmt.toml uses options that stable rustfmt skips silently.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version

      - run: make check-format

  # The halves are separate jobs because clippy builds through
  # RUSTC_WORKSPACE_WRAPPER and shares no artifacts with a normal build.
  build:
    strategy:
      fail-fast: false
      matrix:
        half: [clippy, test]
    name: build (${{ matrix.half }})
    runs-on: ubuntu-latest
    env:
      # Keeps cmake off the network.
      LUNETTE_JOLTPHYSICS_SRC: ${{ github.workspace }}/.jolt
      # The exit-status tests boot a session, which needs both directories.
      # A runner sets neither, and the tests remove HOME.
      XDG_RUNTIME_DIR: ${{ github.workspace }}/.runtime
      XDG_STATE_HOME: ${{ github.workspace }}/.state
    steps:
      - uses: actions/checkout@v4
        with:
          # The dating step reads the history.
          fetch-depth: 0

      # Separate from the checkout, because fetch-depth is not per-repository.
      - name: Check out the submodules
        run: git submodule update --init --recursive --depth 1 --jobs 8

      # The runner image's toolchain lags, and a newer clippy lint then fails
      # as unknown under `-D warnings`.
      - name: Install the current stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install the system dependencies
        # The devshell's inputs, as their Debian names. Debian splits out the
        # xcb packages LÖVR's Linux backend links, which nixpkgs bundles.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake pkg-config python3 patchelf glslang-tools \
            libclang-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxcb1-dev libxext-dev libxkbcommon-dev \
            libx11-xcb-dev libxcb-xinput-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libvulkan-dev libgl1-mesa-dev libcurl4-openssl-dev \
            libasound2-dev libdbus-1-dev libssl-dev libpipewire-0.3-dev \
            libwayland-dev wayland-protocols \
            libopenxr-dev

      # Cargo compares mtimes, and a checkout's are newer than the cached
      # artifacts. git-restore-mtime stamps nothing on git 2.50 and later.
      - name: Date the tree from its commits
        run: |
          git -c core.quotePath=false log --no-merges --pretty=format:@%ct --name-only |
            awk '/^@/ { stamp = substr($0, 2); next }
                 NF && !seen[$0]++ { print stamp "\t" $0 }' |
            while IFS=$'\t' read -r stamp path; do
              if [ -e "$path" ]; then touch -h -d "@$stamp" -- "$path"; fi
            done
          git submodule foreach --recursive --quiet '
            stamp=$(git show -s --format=%ct HEAD)
            find . -type f -not -path "./.git/*" -exec touch -h -d "@$stamp" {} +
          '

      - name: Make the runtime directories
        run: mkdir -p .runtime .state && chmod 700 .runtime

      # The tag must match the GIT_TAG in deps/joltc/CMakeLists.txt.
      - name: Fetch JoltPhysics
        uses: actions/checkout@v4
        with:
          repository: jrouwe/JoltPhysics
          ref: v5.5.0
          path: .jolt

      - uses: Swatinem/rust-cache@v2
        with:
          # An exact key match saves nothing, so replacing a cache means
          # bumping this.
          prefix-key: v1
          key: ${{ matrix.half }}
          cache-all-crates: true
          # LÖVR is built into crates/lunette-lovr's OUT_DIR, which is not
          # cheap to rebuild.
          cache-workspace-crates: true
          # Iterating on a red CI otherwise recompiles everything.
          cache-on-failure: true

      - run: make check-headset
        if: matrix.half == 'test'

      - run: make check-install
        if: matrix.half == 'test'

      - run: make check-${{ matrix.half }}

      - run: make check-definitions
        if: matrix.half == 'test'

      - run: make check-luau-annotations
        if: matrix.half == 'test'

      - run: make check-luau
        if: matrix.half == 'test'
